<text x="600.0" y="266" text-anchor="middle" font-size="14" fill="#40556b">Chooses the person and their exact existing</text>
<text x="600.0" y="284" text-anchor="middle" font-size="14" fill="#40556b">report.</text>
</g>
<g data-node="n1_0"><rect x="425.0" y="404" width="350" height="170" rx="7" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="416" data-purpose-icon="n1_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#745386" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#745386" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="20" rx="1" /><path d="M7 7h.1M10 7h7M7 12h.1m3 0h7M7 17h.1m3 0h7" /></g></svg>
<text x="600.0" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Functions API + SQL job</text>
<text x="600.0" y="504" text-anchor="middle" font-size="14" fill="#40556b">Checks access and records the retrieval</text>
<text x="600.0" y="522" text-anchor="middle" font-size="14" fill="#40556b">job's progress.</text>
</g>
<g data-node="n2_0"><rect x="425.0" y="642" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="654" data-purpose-icon="n2_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2" /><path d="M2 8h20M5 5.5h.1M8 5.5h.1M11 5.5h.1" /></g></svg>
<text x="600.0" y="714" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Container Apps retrieval job</text>
<text x="600.0" y="742" text-anchor="middle" font-size="14" fill="#40556b">Uses a browser worker to retrieve the</text>
<text x="600.0" y="760" text-anchor="middle" font-size="14" fill="#40556b">selected report.</text>
</g>
<g data-node="n3_0"><rect x="425.0" y="880" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="892" data-purpose-icon="n3_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16v6h18v-6M12 17V2m-5 5 5-5 5 5" /></g></svg>
<text x="600.0" y="952" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Capture through the API</text>
<text x="600.0" y="980" text-anchor="middle" font-size="14" fill="#40556b">Checks the captured summary and every report</text>
<text x="600.0" y="998" text-anchor="middle" font-size="14" fill="#40556b">part.</text>
</g>
<g data-node="n4_0"><rect x="425.0" y="1118" width="350" height="170" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="1130" data-purpose-icon="n4_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#527a50" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#527a50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="5" rx="1" /><path d="M4 8v14h16V8M9 12h6m-6 4h6" /></g></svg>
<text x="600.0" y="1190" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Private PDF checkpoint</text>
<text x="600.0" y="1218" text-anchor="middle" font-size="14" fill="#40556b">Keeps the same captured files for safe</text>
<text x="600.0" y="1236" text-anchor="middle" font-size="14" fill="#40556b">retries.</text>
</g>
<g data-node="n5_0"><rect x="425.0" y="1356" width="350" height="170" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="1368" data-purpose-icon="n5_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#996e23" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#996e23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 2 7 3v5c0 4-7 8-7 8S2 14 2 10V5l7-3Z" /><circle cx="17" cy="16" r="4" /><path d="m20 19 3 3" /></g></svg>
<text x="600.0" y="1428" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Document intake + scanning</text>
<text x="600.0" y="1456" text-anchor="middle" font-size="14" fill="#40556b">Saves the files and processes their</text>
<text x="600.0" y="1474" text-anchor="middle" font-size="14" fill="#40556b">malware-check results.</text>
</g>
<g data-node="n6_0"><rect x="425.0" y="1594" width="350" height="170" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
