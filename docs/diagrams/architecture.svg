<text x="600.0" y="1666" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Protected PDF viewer</text>
<text x="600.0" y="1694" text-anchor="middle" font-size="14" fill="#40556b">Shows clean report files only to authorized</text>
<text x="600.0" y="1712" text-anchor="middle" font-size="14" fill="#40556b">viewers.</text>
